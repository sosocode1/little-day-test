<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LITTLE DAY</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fdf3f7; }
      #app { position: fixed; inset: 0; }
      #title {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        text-align: center;
        font: 800 clamp(1.1rem, 2vw, 1.8rem)/1 "Segoe UI", sans-serif;
        letter-spacing: 0.25em;
        color: #fff;
        text-shadow: 0 2px 8px rgba(180, 120, 160, 0.6);
        pointer-events: none;
        user-select: none;
        z-index: 90;
        white-space: nowrap;
        transition: opacity 0.2s ease;
      }
      @media (max-width: 1080px) {
        #title {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <h1 id="title">LITTLE DAY</h1>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
