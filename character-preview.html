<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LITTLE DAY — Character Studio Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f9efe6;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: #4f362c;
    }
    #stage {
      position: fixed;
      inset: 0;
      cursor: grab;
    }
    #stage:active { cursor: grabbing; }
    .hud-top {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(255, 252, 247, 0.92);
      border: 2px solid #ead4c0;
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 8px 24px rgba(120, 82, 60, 0.12);
      z-index: 10;
    }
    .hud-top h1 {
      font-size: 15px;
      font-weight: 800;
      color: #5c3a2c;
    }
    .hud-top p {
      font-size: 11.5px;
      color: #8c6a58;
      margin-top: 2px;
    }
    .controls {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 268px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(255, 252, 247, 0.94);
      border: 2px solid #ead4c0;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(120, 82, 60, 0.14);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .section-title {
      font-size: 11.5px;
      font-weight: 800;
      color: #7c5442;
      margin-bottom: 5px;
      letter-spacing: 0.02em;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    button.chip {
      border: 1.5px solid #e4cbb4;
      background: #fffaf4;
      color: #5b3b2c;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    button.chip:hover {
      background: #f8e8d8;
    }
    button.chip.active {
      background: #6b4432;
      border-color: #6b4432;
      color: #fffaf4;
    }
    .swatches {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1.5px #d7bba4;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { box-shadow: 0 0 0 2.5px #6b4432; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <div class="hud-top">
    <h1>LITTLE DAY · Character Studio</h1>
    <p>드래그: 360° 회전 · 휠: 줌 · 우측 패널: 턴어라운드 & 커스터마이징</p>
  </div>

  <div class="controls" id="controls"></div>

  <script type="module" src="/src/character/previewApp.js"></script>
</body>
</html>
